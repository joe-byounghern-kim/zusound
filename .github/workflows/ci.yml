name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skills validation
        run: pnpm skills:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  library-node18:
    name: Library compatibility (Node 18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js for dependency install
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install package dependency graph
        run: pnpm --filter zusound... install --frozen-lockfile

      - name: Setup Node.js for compatibility checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - name: Typecheck package
        run: pnpm -C packages/zusound typecheck

      - name: Build package
        run: pnpm -C packages/zusound build

      - name: Test package
        run: pnpm -C packages/zusound test

  zustand-compat:
    name: Zustand Compat (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: oldest-4.x
            zustand-version: 4.0.0
          - label: latest-4.x
            zustand-version: 4.5.7
          - label: latest-5.x
            zustand-version: 5.0.14

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Zustand version
        run: pnpm -C packages/zusound add -D zustand@${{ matrix.zustand-version }}

      - name: Typecheck (production package)
        run: pnpm -C packages/zusound exec tsc --noEmit

      - name: Build (package)
        run: pnpm -C packages/zusound build

      - name: Runtime smoke (built package)
        run: |
          node --input-type=module <<'NODE'
          import * as vanilla from 'zustand/vanilla'
          import { createZusound, version, zusound } from './packages/zusound/dist/index.js'

          const createStore = vanilla.createStore ?? vanilla.default
          if (typeof createStore !== 'function') {
            throw new Error('zustand/vanilla createStore is unavailable')
          }
          if (version !== '0.2.4') {
            throw new Error(`unexpected Zusound version: ${version}`)
          }

          const middlewareStore = createStore(
            zusound(
              (set) => ({
                count: 0,
                increment: () => set((state) => ({ count: state.count + 1 })),
              }),
              { enabled: false }
            )
          )
          middlewareStore.getState().increment()
          if (middlewareStore.getState().count !== 1) {
            throw new Error('middleware smoke failed')
          }
          if (typeof middlewareStore.zusoundCleanup !== 'function') {
            throw new Error('middleware cleanup was not attached')
          }
          middlewareStore.zusoundCleanup()

          const subscriberStore = createStore((set) => ({
            count: 0,
            increment: () => set((state) => ({ count: state.count + 1 })),
          }))
          const configuredZusound = createZusound({ enabled: false })
          const unsubscribe = subscriberStore.subscribe(configuredZusound)
          if (typeof unsubscribe !== 'function') {
            throw new Error('subscriber unsubscribe was not returned')
          }
          subscriberStore.getState().increment()
          unsubscribe()
          configuredZusound.cleanup()

          console.log(`Zustand compatibility smoke passed for ${version}`)
          NODE
